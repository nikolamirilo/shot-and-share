<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" role="presentation">
  <!-- The couple. Close crop, two heads leaning together, rim-lit.

       The heads are set 7 units apart and at different heights. Any closer and
       they weld into one silhouette, which is a blob rather than two people. -->
  <defs>
    <linearGradient id="c-sky" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F0C79E" />
      <stop offset="0.5" stop-color="#C06E6A" />
      <stop offset="1" stop-color="#66293C" />
    </linearGradient>
    <filter id="c-bokeh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="c-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" />
    </filter>
    <radialGradient id="c-vig" cx="50%" cy="42%" r="70%">
      <stop offset="50%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.44" />
    </radialGradient>
  </defs>

  <rect width="100" height="100" fill="url(#c-sky)" />

  <g filter="url(#c-bokeh)" fill="#FFE6BC">
    <circle cx="12" cy="18" r="11" opacity="0.5" />
    <circle cx="88" cy="12" r="13" opacity="0.44" />
    <circle cx="52" cy="10" r="7" opacity="0.44" />
    <circle cx="94" cy="44" r="8" opacity="0.32" />
  </g>

  <!-- The rim: a warm disc behind each head, offset outward far enough that the
       only part of it left uncovered is the sliver down the side away from the
       other one. Offset it by less than the radius difference and the light
       carries over the crown as well, which is a halo, not a rim. -->
  <g filter="url(#c-edge)" fill="#F2C68F" opacity="0.42">
    <ellipse cx="27" cy="50" rx="14.6" ry="16.6" />
    <ellipse cx="74" cy="46" rx="13.6" ry="15.6" />
  </g>

  <g filter="url(#c-edge)" fill="#241318" opacity="0.93">
    <path d="M-4 100 V86 Q-4 72 26 70 Q52 72 52 86 V100 Z" />
    <path d="M46 100 V84 Q46 70 74 68 Q104 70 104 84 V100 Z" />
    <rect x="25" y="58" width="14" height="18" />
    <rect x="62" y="54" width="14" height="18" />
    <ellipse cx="32" cy="49" rx="14" ry="16" />
    <ellipse cx="69" cy="45" rx="13" ry="15" />
  </g>

  <rect width="100" height="100" fill="url(#c-vig)" />
</svg>
