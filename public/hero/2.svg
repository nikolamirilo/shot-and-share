<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" role="presentation">
  <!-- The dance floor. Three figures, arms up, under a single light. -->
  <defs>
    <linearGradient id="b-sky" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7B3350" />
      <stop offset="0.5" stop-color="#B85F60" />
      <stop offset="1" stop-color="#3A1A26" />
    </linearGradient>
    <radialGradient id="b-lamp" cx="50%" cy="16%" r="56%">
      <stop offset="0" stop-color="#FFE0B0" stop-opacity="0.82" />
      <stop offset="1" stop-color="#FFE0B0" stop-opacity="0" />
    </radialGradient>
    <filter id="b-bokeh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" />
    </filter>
    <filter id="b-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" />
    </filter>
    <radialGradient id="b-vig" cx="50%" cy="45%" r="72%">
      <stop offset="50%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.45" />
    </radialGradient>
  </defs>

  <rect width="100" height="100" fill="url(#b-sky)" />
  <rect width="100" height="100" fill="url(#b-lamp)" />

  <g filter="url(#b-bokeh)" fill="#FFE6BC">
    <circle cx="13" cy="26" r="6" opacity="0.42" />
    <circle cx="89" cy="19" r="7" opacity="0.38" />
    <circle cx="65" cy="11" r="4.5" opacity="0.48" />
  </g>

  <g filter="url(#b-edge)" fill="#2A1520" opacity="0.9">
    <circle cx="22" cy="48" r="7" />
    <path d="M13 100 V66 q0-8 9-8 t9 8 V100 Z" />
    <circle cx="50" cy="40" r="7.5" />
    <path d="M40 100 V60 q0-9 10-9 t10 9 V100 Z" />
    <circle cx="78" cy="53" r="6.5" />
    <path d="M69 100 V71 q0-8 9-8 t9 8 V100 Z" />
  </g>

  <g stroke="#2A1520" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#b-edge)">
    <path d="M15 70 L6 47" stroke-width="5" />
    <path d="M29 70 L38 45" stroke-width="5" />
    <path d="M42 64 L32 39" stroke-width="5.4" />
    <path d="M58 64 L69 37" stroke-width="5.4" />
    <path d="M71 75 L62 55" stroke-width="4.6" />
    <path d="M85 75 L93 51" stroke-width="4.6" />
  </g>

  <rect width="100" height="100" fill="url(#b-vig)" />
</svg>
