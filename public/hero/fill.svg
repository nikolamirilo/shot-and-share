<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="1200" height="400" role="presentation">
  <!-- The frame that fills the headline. Not one of the six in the contact
       sheet: those are lit for their own square, and a headline needs a
       picture graded for legibility instead.

       Two constraints the sheet frames do not have to meet. It is wide, 3:1,
       so `cover` crops it rather than stretching it across a two-line block.
       And nothing in it is lighter than #8A4A52 - 6:1 on linen before the
       claret wash in `.photo-type` goes over the top - because every pixel
       here ends up inside a letterform. -->
  <defs>
    <linearGradient id="fill-sky" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6E1F33" />
      <stop offset="0.55" stop-color="#421828" />
      <stop offset="1" stop-color="#180F13" />
    </linearGradient>
    <filter id="fill-bokeh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="fill-bulb" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>
    <filter id="fill-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.9" />
    </filter>
    <radialGradient id="fill-vig" cx="50%" cy="42%" r="66%">
      <stop offset="40%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.45" />
    </radialGradient>
  </defs>

  <rect width="300" height="100" fill="url(#fill-sky)" />

  <!-- Out-of-focus light, kept at 0.28 so it never climbs out of range. -->
  <g filter="url(#fill-bokeh)" fill="#FFE2B8">
    <circle cx="34" cy="24" r="17" opacity="0.26" />
    <circle cx="96" cy="15" r="13" opacity="0.22" />
    <circle cx="163" cy="27" r="19" opacity="0.24" />
    <circle cx="232" cy="17" r="14" opacity="0.2" />
    <circle cx="276" cy="34" r="16" opacity="0.18" />
    <circle cx="128" cy="58" r="11" opacity="0.14" />
    <circle cx="205" cy="52" r="12" opacity="0.13" />
  </g>

  <g fill="none" stroke="#150E11" stroke-width="1" opacity="0.4">
    <path d="M-4 18 Q78 40 160 20 Q240 2 304 22" />
  </g>
  <g fill="#FFE2B8" filter="url(#fill-bulb)" opacity="0.24">
    <circle cx="22" cy="23" r="3.4" />
    <circle cx="74" cy="33" r="3.6" />
    <circle cx="126" cy="34" r="3.6" />
    <circle cx="178" cy="19" r="3.4" />
    <circle cx="232" cy="9" r="3.2" />
    <circle cx="284" cy="17" r="3.2" />
  </g>

  <!-- A room of people, read as shape rather than detail. -->
  <g filter="url(#fill-edge)" fill="#160E12" opacity="0.9">
    <path d="M8 100 V86 q0-11 18-11 t18 11 V100 Z" />
    <circle cx="26" cy="74" r="9" />
    <path d="M54 100 V79 q0-12 20-12 t20 12 V100 Z" />
    <circle cx="74" cy="67" r="10" />
    <path d="M107 100 V88 q0-11 17-11 t17 11 V100 Z" />
    <circle cx="124" cy="76" r="8.5" />
    <path d="M152 100 V78 q0-12 20-12 t20 12 V100 Z" />
    <circle cx="172" cy="66" r="10" />
    <path d="M204 100 V85 q0-11 18-11 t18 11 V100 Z" />
    <circle cx="222" cy="73" r="9" />
    <path d="M253 100 V81 q0-12 19-12 t19 12 V100 Z" />
    <circle cx="272" cy="69" r="9.5" />
  </g>

  <rect width="300" height="100" fill="url(#fill-vig)" />
</svg>
