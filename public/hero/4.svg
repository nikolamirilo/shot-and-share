<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" role="presentation">
  <!-- Sparklers. The darkest frame in the sheet, so the grid has a low note. -->
  <defs>
    <linearGradient id="d-sky" x1="0.3" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#5A2740" />
      <stop offset="0.55" stop-color="#3A1A28" />
      <stop offset="1" stop-color="#1F1116" />
    </linearGradient>
    <radialGradient id="d-glow" cx="52%" cy="46%" r="46%">
      <stop offset="0" stop-color="#FFD79A" stop-opacity="0.75" />
      <stop offset="1" stop-color="#FFD79A" stop-opacity="0" />
    </radialGradient>
    <filter id="d-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
    <filter id="d-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
    <radialGradient id="d-vig" cx="50%" cy="46%" r="70%">
      <stop offset="45%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.5" />
    </radialGradient>
  </defs>

  <rect width="100" height="100" fill="url(#d-sky)" />
  <rect width="100" height="100" fill="url(#d-glow)" />

  <g filter="url(#d-edge)" fill="#150C10" opacity="0.94">
    <circle cx="30" cy="58" r="7" />
    <path d="M19 100 V76 q0-9 11-9 t11 9 V100 Z" />
    <circle cx="70" cy="61" r="6.5" />
    <path d="M60 100 V79 q0-8 10-8 t10 8 V100 Z" />
  </g>

  <!-- The written light: two arcs left in the air, plus the sparks off them. -->
  <g fill="none" stroke="#FFE3AE" stroke-linecap="round" filter="url(#d-soft)">
    <path d="M22 66 C30 34 56 30 62 50" stroke-width="2.6" opacity="0.85" />
    <path d="M44 74 C52 52 70 48 80 62" stroke-width="2" opacity="0.6" />
  </g>
  <g fill="#FFF0CE" filter="url(#d-soft)">
    <circle cx="62" cy="50" r="3.4" opacity="0.95" />
    <circle cx="22" cy="66" r="2.4" opacity="0.8" />
    <circle cx="80" cy="62" r="2" opacity="0.7" />
  </g>
  <g fill="#FFF2D6">
    <circle cx="56" cy="42" r="0.9" opacity="0.8" />
    <circle cx="68" cy="43" r="0.7" opacity="0.7" />
    <circle cx="35" cy="47" r="0.8" opacity="0.65" />
    <circle cx="47" cy="37" r="0.6" opacity="0.6" />
    <circle cx="74" cy="55" r="0.7" opacity="0.6" />
  </g>

  <rect width="100" height="100" fill="url(#d-vig)" />
</svg>
