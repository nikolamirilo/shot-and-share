<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" role="presentation">
  <!-- The toast. Two glasses raised out of a crowd, backlit. -->
  <defs>
    <linearGradient id="a-sky" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F4D2A8" />
      <stop offset="0.52" stop-color="#C9756B" />
      <stop offset="1" stop-color="#5E2839" />
    </linearGradient>
    <filter id="a-bokeh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>
    <filter id="a-edge" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
    <radialGradient id="a-vig" cx="50%" cy="44%" r="72%">
      <stop offset="52%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.42" />
    </radialGradient>
  </defs>

  <rect width="100" height="100" fill="url(#a-sky)" />

  <g filter="url(#a-bokeh)" fill="#FFE6BC">
    <circle cx="16" cy="14" r="9" opacity="0.5" />
    <circle cx="83" cy="20" r="11" opacity="0.44" />
    <circle cx="50" cy="7" r="7" opacity="0.5" />
    <circle cx="72" cy="47" r="6" opacity="0.32" />
    <circle cx="27" cy="41" r="5" opacity="0.28" />
  </g>

  <!-- Arms, from the shoulders below up to the feet of the glasses. -->
  <g stroke="#241318" stroke-linecap="round" fill="none" opacity="0.88">
    <path d="M30 96 L36 62" stroke-width="7" />
    <path d="M72 98 L64 62" stroke-width="6.5" />
  </g>

  <g filter="url(#a-edge)">
    <g transform="translate(37 26) rotate(14)">
      <path d="M-8 0 H8 L5.2 17 Q4.6 21 0 21 Q-4.6 21 -5.2 17 Z" fill="#2B1620" opacity="0.86" />
      <rect x="-1" y="21" width="2" height="13" fill="#2B1620" opacity="0.86" />
      <ellipse cx="0" cy="35" rx="6" ry="1.6" fill="#2B1620" opacity="0.86" />
      <path d="M-6.4 7 H6.4 L5.2 17 Q4.6 21 0 21 Q-4.6 21 -5.2 17 Z" fill="#F7CE93" opacity="0.4" />
    </g>
    <g transform="translate(63 26) rotate(-14)">
      <path d="M-8 0 H8 L5.2 17 Q4.6 21 0 21 Q-4.6 21 -5.2 17 Z" fill="#2B1620" opacity="0.86" />
      <rect x="-1" y="21" width="2" height="13" fill="#2B1620" opacity="0.86" />
      <ellipse cx="0" cy="35" rx="6" ry="1.6" fill="#2B1620" opacity="0.86" />
      <path d="M-6.4 7 H6.4 L5.2 17 Q4.6 21 0 21 Q-4.6 21 -5.2 17 Z" fill="#F7CE93" opacity="0.4" />
    </g>
  </g>

  <!-- The flare where the two rims meet. -->
  <circle cx="50" cy="26" r="7" fill="#FFE9C4" opacity="0.55" filter="url(#a-bokeh)" />

  <g fill="#241318" opacity="0.92">
    <circle cx="24" cy="84" r="8" />
    <path d="M8 100 q0-11 16-11 t16 11 Z" />
    <circle cx="74" cy="88" r="7.5" />
    <path d="M59 100 q0-10 15-10 t15 10 Z" />
  </g>

  <rect width="100" height="100" fill="url(#a-vig)" />
</svg>
