<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" role="presentation">
  <!-- The room, from the back. A row of guests under a string of lights.

       Each pair is a head over a dome whose apex sits a unit or two *inside*
       the head. Draw the dome from a quadratic's control point instead and it
       lands ten units short, which leaves the heads floating over their own
       shoulders. -->
  <defs>
    <linearGradient id="f-sky" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#E9BE9D" />
      <stop offset="0.5" stop-color="#B4675F" />
      <stop offset="1" stop-color="#4E2233" />
    </linearGradient>
    <filter id="f-bokeh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.8" />
    </filter>
    <filter id="f-bulb" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
    <filter id="f-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" />
    </filter>
    <radialGradient id="f-vig" cx="50%" cy="45%" r="72%">
      <stop offset="52%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.42" />
    </radialGradient>
  </defs>

  <rect width="100" height="100" fill="url(#f-sky)" />

  <g filter="url(#f-bokeh)" fill="#FFE6BC">
    <circle cx="20" cy="46" r="6" opacity="0.28" />
    <circle cx="80" cy="49" r="7" opacity="0.26" />
  </g>

  <!-- Two strings, sagging. -->
  <g fill="none" stroke="#3A2028" stroke-width="0.9" opacity="0.55">
    <path d="M-2 10 Q50 30 102 8" />
    <path d="M-2 26 Q50 44 102 22" />
  </g>
  <g fill="#FFEDC8" filter="url(#f-bulb)">
    <circle cx="10" cy="15" r="2.4" opacity="0.9" />
    <circle cx="28" cy="21" r="2.6" opacity="0.95" />
    <circle cx="50" cy="23.5" r="2.6" opacity="1" />
    <circle cx="72" cy="21" r="2.6" opacity="0.95" />
    <circle cx="90" cy="14" r="2.4" opacity="0.9" />
    <circle cx="18" cy="32" r="2.2" opacity="0.8" />
    <circle cx="40" cy="38" r="2.3" opacity="0.85" />
    <circle cx="62" cy="38" r="2.3" opacity="0.85" />
    <circle cx="84" cy="30" r="2.2" opacity="0.8" />
  </g>

  <g filter="url(#f-edge)" fill="#241318" opacity="0.92">
    <path d="M-2 100 V88 q0-9 12-9 t12 9 V100 Z" />
    <circle cx="10" cy="74" r="7" />
    <path d="M23 100 V83 q0-10 13-10 t13 10 V100 Z" />
    <circle cx="36" cy="68" r="7.5" />
    <path d="M48 100 V87 q0-9 12-9 t12 9 V100 Z" />
    <circle cx="60" cy="72" r="7" />
    <path d="M72 100 V81 q0-11 14-11 t14 11 V100 Z" />
    <circle cx="86" cy="65" r="8" />
  </g>

  <rect width="100" height="100" fill="url(#f-vig)" />
</svg>
