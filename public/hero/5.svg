<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" role="presentation">
  <!-- The table, late. Bottles, glasses and two candles, shot across it. -->
  <defs>
    <linearGradient id="e-sky" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#EFC9A2" />
      <stop offset="0.55" stop-color="#B96C68" />
      <stop offset="1" stop-color="#5A2637" />
    </linearGradient>
    <linearGradient id="e-cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1F26" stop-opacity="0.72" />
      <stop offset="1" stop-color="#1E1216" stop-opacity="0.92" />
    </linearGradient>
    <filter id="e-bokeh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="e-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
    <filter id="e-flame" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" />
    </filter>
    <radialGradient id="e-vig" cx="50%" cy="45%" r="72%">
      <stop offset="52%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.42" />
    </radialGradient>
  </defs>

  <rect width="100" height="100" fill="url(#e-sky)" />

  <g filter="url(#e-bokeh)" fill="#FFE6BC">
    <circle cx="18" cy="16" r="8" opacity="0.42" />
    <circle cx="82" cy="13" r="9" opacity="0.4" />
    <circle cx="52" cy="22" r="5" opacity="0.34" />
  </g>

  <g filter="url(#e-edge)" fill="#2A1620" opacity="0.9">
    <!-- Two bottles. -->
    <path d="M12 74 V50 q0-4 3-6 V36 h5 v8 q3 2 3 6 v30 Z" />
    <path d="M76 74 V52 q0-4 3-6 V34 h5 v12 q3 2 3 6 v22 Z" />
    <!-- Three glasses. -->
    <path d="M30 74 V62 l-3-10 h11 l-3 10 v12 Z" />
    <path d="M45 74 V64 l-3-9 h10 l-3 9 v10 Z" />
    <path d="M63 74 V60 l-3-11 h11 l-3 11 v14 Z" />
    <!-- Candles. -->
    <rect x="53" y="52" width="4" height="22" rx="1.2" />
    <rect x="70" y="56" width="3.6" height="18" rx="1.2" />
  </g>

  <g fill="#FFECC4" filter="url(#e-flame)">
    <ellipse cx="55" cy="48" rx="2.2" ry="4" opacity="0.95" />
    <ellipse cx="71.8" cy="52.5" rx="1.9" ry="3.4" opacity="0.9" />
  </g>

  <rect y="74" width="100" height="26" fill="url(#e-cloth)" />
  <g fill="#FFD9A6" opacity="0.16">
    <rect x="53.4" y="74" width="3.2" height="12" rx="1.4" />
    <rect x="70.2" y="74" width="3" height="10" rx="1.4" />
  </g>

  <rect width="100" height="100" fill="url(#e-vig)" />
</svg>
