<svg viewBox="0 0 240 200" width="240" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Say Cheese">
  <title>Say Cheese</title>
  <!-- Flash burst -->
  <g stroke="#1F1607" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M 34 40 L 24 30" />
    <path d="M 50 30 L 46 17" />
    <path d="M 22 54 L 8 50" />
  </g>
  <!-- Viewfinder bump and flash unit -->
  <rect x="52" y="28" width="54" height="22" rx="7" fill="#B0670F" />
  <rect x="156" y="30" width="40" height="20" rx="6" fill="#B0670F" />
  <!-- Body -->
  <rect x="18" y="46" width="204" height="136" rx="22" fill="#1F1607" />
  <!-- Shutter light, the only Ember in the system -->
  <circle cx="200" cy="66" r="6.5" fill="#E2542F" />
  <!-- Lens barrel -->
  <circle cx="120" cy="114" r="58" fill="#B0670F" />
  <circle cx="120" cy="114" r="50" fill="#1F1607" />
  <!-- The frame: what the camera sees -->
  <circle cx="120" cy="114" r="38" fill="#FFFDF4" />
  <defs>
    <clipPath id="frame">
      <circle cx="120" cy="114" r="38" />
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <g transform="translate(120 114) rotate(-7)">
      <path d="M -31 -15 L 27 -22 L 33 13 L -25 21 Z" transform="translate(0 8)" fill="#B0670F" stroke="#1F1607" stroke-width="4" stroke-linejoin="round" />
      <path d="M -31 -15 L 27 -22 L 33 13 L -25 21 Z" fill="#FFC02E" stroke="#1F1607" stroke-width="4" stroke-linejoin="round" />
      <circle cx="-15" cy="-3" r="7" fill="#4A3110" />
      <circle cx="7" cy="3" r="5" fill="#4A3110" />
      <circle cx="19" cy="-9" r="3.4" fill="#4A3110" />
      <circle cx="-3" cy="-13" r="3" fill="#4A3110" />
      <circle cx="9" cy="13" r="4.2" fill="#4A3110" />
    </g>
  </g>
  <!-- Focus brackets -->
  <g stroke="#B0670F" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M 96 98 L 96 90 L 104 90" />
    <path d="M 144 98 L 144 90 L 136 90" />
    <path d="M 96 130 L 96 138 L 104 138" />
    <path d="M 144 130 L 144 138 L 136 138" />
  </g>
</svg>
