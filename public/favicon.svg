<svg viewBox="0 0 200 200" width="64" height="64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shot &amp; Share">
  <title>Shot &amp; Share</title>
  <!-- The mark on a plate, held off the edges so a browser can round the
       corners without clipping a bracket. The whole mark is scaled as one
       group rather than redrawn at new coordinates, so the trail keeps its
       distance from the print at any size. At 16px the three lines close up
       against the print and the middle reads as one claret shape moving
       right, which is the most a tab can carry. -->
  <rect width="200" height="200" rx="44" fill="#F6F2F3" />
  <g transform="translate(100 100) scale(0.84) translate(-100 -100)">
    <g stroke="#181214" stroke-width="18" stroke-linecap="square" fill="none">
      <path d="M 26 76 L 26 34 Q 26 26 34 26 L 76 26" />
      <path d="M 26 76 L 26 34 Q 26 26 34 26 L 76 26" transform="rotate(90 100 100)" />
      <path d="M 26 76 L 26 34 Q 26 26 34 26 L 76 26" transform="rotate(180 100 100)" />
      <path d="M 26 76 L 26 34 Q 26 26 34 26 L 76 26" transform="rotate(270 100 100)" />
    </g>
    <g stroke="#7A1230" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 82 L82 82" />
      <path d="M46 101 L82 101" />
      <path d="M58 120 L82 120" />
    </g>
    <rect x="94" y="78" width="46" height="46" rx="10" fill="#7A1230" transform="rotate(-12 117 101)" />
  </g>
</svg>
