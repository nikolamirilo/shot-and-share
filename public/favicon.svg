<svg viewBox="0 0 200 200" width="64" height="64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shot &amp; Share">
  <title>Shot &amp; Share</title>
  <!-- Crop brackets and the shutter dot. No frame around it: it has to survive 16px. -->
  <rect width="200" height="200" rx="44" fill="#F6F2F3" />
  <g stroke="#181214" stroke-width="18" stroke-linecap="square" fill="none">
    <path d="M 42 84 L 42 50 Q 42 42 50 42 L 84 42" />
    <path d="M 42 84 L 42 50 Q 42 42 50 42 L 84 42" transform="rotate(90 100 100)" />
    <path d="M 42 84 L 42 50 Q 42 42 50 42 L 84 42" transform="rotate(180 100 100)" />
    <path d="M 42 84 L 42 50 Q 42 42 50 42 L 84 42" transform="rotate(270 100 100)" />
  </g>
  <circle cx="100" cy="100" r="20" fill="#7A1230" />
</svg>
